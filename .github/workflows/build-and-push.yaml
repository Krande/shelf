name: Publish image

# Builds the shelf image (API + bundled SPA) and pushes it to this repo's
# GitHub Container Registry namespace (ghcr.io/<owner>/shelf). Auth is the
# built-in GITHUB_TOKEN — no external secrets required.
#
# We only push on tag: the CI system manages release tagging (see
# tag-on-pr-merge.yaml), and this workflow latches onto that. A tag push
# `v1.2.3` publishes :1.2.3, :1.2, :latest and :sha-<short>. workflow_dispatch
# is available for manual re-runs but is not part of the normal release flow.
#
# Dockerfile.gpu is NOT built here. It installs olmOCR + Torch/CUDA, which
# does not fit in a hosted runner's disk budget; build that image on the GPU
# host that actually runs the worker.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile stamps this into SHELF_IMAGE_TAG (surfaced by /api)
          # and VITE_APP_VERSION, so a running pod can say which build it is
          # without anyone reading the deployment YAML. Since this workflow
          # only ever fires on a version tag, the tag name is the honest value.
          build-args: |
            DOCKER_IMAGE_TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
