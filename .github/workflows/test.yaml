name: Test

# Runs the backend pytest suite, plus the CLI's. Independent of the other CI
# workflows so it reports its own required status check.
#
# The suite is not DB-free: conftest's `client` fixture TRUNCATEs the core
# tables against a live Postgres, so a service container is started and the
# Alembic migrations are applied before pytest runs. Tests that never request
# `client` (JWT roundtrip, in-memory storage, PDF quality heuristics) skip the
# DB entirely, but they share the same job.
#
# POSTGRES_USER=shelf is the database superuser here, which the trigram
# migrations need — they issue CREATE EXTENSION pg_trgm.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shelf
          POSTGRES_PASSWORD: shelf
          POSTGRES_DB: shelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SHELF_DATABASE_URL: postgresql+asyncpg://shelf:shelf@localhost:5432/shelf

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true

      - name: Apply migrations
        run: pixi run alembic-up

      - run: pixi run test

      # The CLI's tests fake the HTTP client, so they need neither the
      # database above nor a running instance. They ride along here
      # rather than in their own job to avoid a second pixi install for
      # half a second of work.
      - run: pixi run cli-test
