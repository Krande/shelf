name: Typecheck

# Runs mypy in strict mode over backend/src. Independent of the other CI
# workflows so it reports its own required status check.
#
# The GPU worker's ML imports (torch, transformers, olmocr) are absent from
# this environment by design — they live in pixi.toml's `gpu` feature, which
# only the `gpu` environment installs, and are lazy-imported inside the
# runner's entry points. pyproject.toml exempts those modules from the
# missing-stub error, so this job checks the code that actually ships in the
# CPU image without needing a multi-GB CUDA install.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true

      - run: pixi run typecheck
