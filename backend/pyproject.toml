[project]
name = "shelf"
version = "0.10.1"
description = "Web library and document management server"
requires-python = ">=3.12"
# No dependency list, by design: pixi.toml and pixi.lock decide every package
# version for this project, local and in the images alike. Duplicating the
# list here is how the two drifted apart in the first place — the images
# resolved these specs from PyPI at build time while CI ran the lockfile, so a
# dependency could change under production without a single test noticing. It
# did: see the greenlet note in pixi.toml's `[dependencies]`.
#
# What used to be the `[ocr]` and `[gpu]` extras are pixi features of the same
# names. They exist because ocrmypdf pins pypdfium2>=5.0 while marker-pdf (via
# olmocr) pins ==4.30.0, so the two OCR tiers cannot share an environment —
# `[environments]` in pixi.toml keeps them apart and each image installs one.
#
# Installing this package with pip alone therefore gets you the code and no
# dependencies. That is a deliberate trade: shelf is a deployed application,
# not a library anyone pip-installs, and the one place versions are decided is
# worth more than pip-installability.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["shelf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

# The GPU worker's ML stack plus PyMuPDF. torch / transformers / olmocr live
# in pixi.toml's `gpu` feature and are deliberately absent from the default
# (and CI) environment — shelf.worker.olmocr_runner lazy-imports them inside its entry
# points precisely so the CPU image never installs them. fitz (PyMuPDF) *is*
# installed but ships no py.typed marker. Neither case is something a type
# annotation here can resolve, so the imports are exempted rather than left to
# fail the run on every machine that isn't a GPU host.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "olmocr.*", "fitz.*"]
ignore_missing_imports = true
