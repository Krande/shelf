[project]
name = "shelf-migrate"
version = "0.0.0"
description = "One-shot Zotero (MariaDB + Garage S3) → Shelf (Postgres + Garage S3) importer."
requires-python = ">=3.12"
dependencies = [
    "shelf",
    "aiomysql>=0.2",
    "obstore>=0.9",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate"]

[project.scripts]
shelf-migrate = "migrate.__main__:main"
