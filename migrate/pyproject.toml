[project]
name = "shelf-migrate"
version = "0.0.0"
description = "One-shot Zotero (MariaDB + Garage S3) → Shelf (Postgres + Garage S3) importer."
requires-python = ">=3.12"
# Empty for the same reason as backend/pyproject.toml: pixi.toml and pixi.lock
# are where versions are decided. The importer's own needs — aiomysql and
# beautifulsoup4 on top of the base set — live in pixi.toml's `dev` feature,
# which is also the only environment that installs this package.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate"]

[project.scripts]
shelf-migrate = "migrate.__main__:main"
